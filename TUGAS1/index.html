<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login SITTA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="logo-circle">UT</div>
      <h1>Selamat Datang</h1>
      <p class="muted">Aplikasi Pemesanan Bahan Ajar</p>

      <form id="loginForm" class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="contoh: admin@ut.ac.id" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password" required />

        <button type="submit" class="btn btn-primary full">Login</button>
      </form>

      <div class="auto-links">
        <button type="button" class="text-button" onclick="openModal('forgotModal')">Lupa Password</button>
        <button type="button" class="text-button" onclick="openModal('registerModal')">Daftar</button>
      </div>
    </section>
  </main>

  <!-- Modal Lupa Password -->
  <div id="forgotModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('forgotModal')">&times;</span>
      <h3>Lupa Password</h3>
      <p>Silakan hubungi admin UT untuk reset password.</p>
    </div>
  </div>

  <!-- Modal Daftar -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('registerModal')">&times;</span>
      <h3>Pendaftaran Akun Baru</h3>
      <form>
        <input type="text" placeholder="Nama Lengkap" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit" class="btn btn-primary full">Daftar</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
